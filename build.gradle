plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.6.0'
}

group 'com.yearrow.beaverui'
version '1.0.0'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        // 构建目标：2024.2（产物向下兼容 since-build=223，即 IDEA 2023.1+）
        intellijIdeaUltimate('2024.2')
        // Vue/JS 语言支持（原插件依赖 JavaScript 插件；platform 模块为默认依赖无需声明）
        bundledPlugin 'JavaScript'
    }
}

java {
    toolchain {
        // 本机 Temurin 21 可编译 target 17；若团队机器无 21，Gradle 会自动探测任意 >=17 的 JDK
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// 声明兼容 IDEA 2023.1+（不 patch 成构建目标版本 242）
tasks.named('patchPluginXml') {
    sinceBuild = '223'
    untilBuild = provider { null }
}
